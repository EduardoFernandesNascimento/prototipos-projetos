<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início · Rango</title>
  <meta name="description" content="Rango: protótipo de delivery de comida.">
  <link rel="icon" href="img/favicon-rango.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/dados.js" defer></script>
  <script src="js/creditos.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/loja.js" defer></script>
  <script src="js/telas.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/sessao.js" defer></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header role="banner" class="cabecalho">
    <div class="cabecalho__faixa">
      <a class="marca" href="#/">
        <svg class="marca__logo" viewBox="0 0 128 32" width="112" height="28" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round">
            <path d="M10 11.5c-1.8-2 1.8-3.6 0-5.6"/>
            <path d="M16 11.5c-1.8-2.4 1.8-4.6 0-7"/>
            <path d="M22 11.5c-1.8-2 1.8-3.6 0-5.6"/>
          </g>
          <path fill="currentColor" d="M2 14h28a14 13 0 0 1-28 0z"/>
          <rect x="10" y="26.5" width="12" height="3" rx="1.5" fill="currentColor"/>
          <path class="marca__r" fill="none" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" d="M13 24.5V16.5h3.4a2.4 2.4 0 0 1 0 4.8H13m3.6 0 2.9 3.2"/>
          <g class="marca__nome" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M42 24V6h5.5a4.75 4.75 0 0 1 0 9.5H42m5.5 0L53 24"/>
            <path d="M70.5 12v12m0-6a5 5 0 0 0-10 0a5 5 0 0 0 10 0"/>
            <path d="M78 24V12m0 5a4.5 4.5 0 0 1 9 0v7"/>
            <path d="M105 12v13a4.5 4.5 0 0 1-8.5 2.5M105 18a5 5 0 0 0-10 0a5 5 0 0 0 10 0"/>
            <path d="M122.5 18a5.5 5.5 0 0 0-11 0a5.5 5.5 0 0 0 11 0"/>
          </g>
        </svg>
        <span class="vo">Rango</span>
      </a>
      <div class="conta" data-estado="anonimo">
        <button type="button" id="botao-entrar" class="botao-secundario botao-compacto" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
          <span>Entrar</span>
        </button>
        <p class="conta__saudacao" hidden></p>
        <button type="button" id="botao-sair" class="botao-secundario botao-compacto" hidden>Sair</button>
      </div>
      <a id="link-carrinho" class="link-carrinho" href="#/carrinho" aria-label="Carrinho, 0 itens">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5.2 4H2V2h4.8l1 2H21l-3.6 8.6a2 2 0 0 1-1.8 1.4H8.1l-.9 2H19v2H4l2.2-4.5L5.2 4z"/></svg>
        <span class="contador" aria-hidden="true">0</span>
      </a>
    </div>
  </header>

  <main id="conteudo" tabindex="-1" class="conteudo"></main>

  <footer class="rodape">
    <p>Protótipo: nenhum pedido é enviado de verdade.</p>
    <p><a class="rodape__link" href="#/creditos">Créditos das fotos</a></p>
  </footer>

  <dialog id="dialogo-troca" class="dialogo" aria-labelledby="dialogo-troca-titulo" aria-describedby="dialogo-troca-texto">
    <h2 id="dialogo-troca-titulo">Começar um novo carrinho?</h2>
    <p id="dialogo-troca-texto"></p>
    <div class="dialogo__acoes">
      <button type="button" class="botao-secundario" data-acao="cancelar">Cancelar</button>
      <button type="button" class="botao-principal" data-acao="confirmar">Esvaziar e adicionar</button>
    </div>
  </dialog>

  <dialog id="dialogo-login" class="dialogo" aria-labelledby="dialogo-login-titulo" aria-describedby="dialogo-login-aviso">
    <h2 id="dialogo-login-titulo">Entrar no Rango</h2>
    <p id="dialogo-login-aviso" class="dialogo__aviso"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg><span>Login simulado: nada é enviado e a senha não fica guardada.</span></p>
    <form id="form-login" class="formulario-login" novalidate>
      <div class="campo" data-campo="login-email">
        <label for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false">
        <p class="erro" id="login-email-erro" hidden></p>
      </div>
      <div class="campo" data-campo="login-senha">
        <label for="login-senha">Senha</label>
        <p class="dica" id="login-senha-dica">Mínimo de 6 caracteres.</p>
        <input id="login-senha" name="senha" type="password" autocomplete="current-password" aria-describedby="login-senha-dica">
        <p class="erro" id="login-senha-erro" hidden></p>
      </div>
      <div class="dialogo__acoes">
        <button type="button" class="botao-secundario" data-acao="cancelar">Cancelar</button>
        <button type="submit" class="botao-principal" id="login-enviar"><span class="girador" aria-hidden="true"></span><span class="botao__texto">Entrar</span></button>
      </div>
    </form>
  </dialog>

  <div class="aviso-caixa" data-visivel="nao">
    <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
    <button type="button" class="aviso__fechar" aria-label="Fechar aviso"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button>
  </div>
</body>
</html>
